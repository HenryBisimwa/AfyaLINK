<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AfyaLink</title>
    <link rel="stylesheet" href="src/output.css">

</head>
<body class="bg-white">
    <div id="logoA" class=" min-h-screen flex flex-col items-center justify-center opacity-0 transition-opacity duration-1000">
        <img class="w-32 h-32 object-contain rounded-2xl" src="/projetAfyaLINK/autres/logos/logo!.png" alt="Logo AfyaLink">
         <p><span class="text-green-600 font-bold lg:text-3xl text-xl">Afya</span><span class="text-blue-700 font-bold lg:text-3xl text-xl">LINK</span></p>
    </div>

    <script>
        let logoA = document.querySelector("#logoA");

        setTimeout(function () {
            logoA.classList.remove("opacity-0");
            logoA.classList.add("opacity-100");
        }, 100);


        setTimeout(function () {
            logoA.classList.remove("opacity-100");
            logoA.classList.add("opacity-50");
        }, 1200);

        setTimeout(function () {
            logoA.classList.remove("opacity-50");
            logoA.classList.add("opacity-100");
        }, 2500);

        setTimeout(function () {
            logoA.classList.remove("opacity-100");
            logoA.classList.add("opacity-50");
        }, 3800);


        setTimeout(function () {
            window.location.href = "ProjetAfyaLINK/landing.html";
        }, 4000);

    </script>

</body>
</html>
