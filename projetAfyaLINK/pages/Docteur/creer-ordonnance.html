<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une ordonnance</title>

    <link rel="stylesheet" href="../../../src/output.css">
</head>

<body class="bg-gray-100">
<header class="bg-white shadow">
<div class="max-w-5xl mx-auto flex justify-between items-center p-4">
<h1 class="text-3xl font-bold">
<span class="text-green-600">Afya</span><span class="text-blue-700">Link</span>
</h1>
<a href="dashboard2.html"
class="text-green-600 font-semibold">
← Retour
</a>
</div>
</header>
<main class="max-w-3xl mx-auto p-6">
<div class="bg-white rounded-2xl shadow-lg p-8">
<h2 class="text-3xl font-bold text-center mb-8">
Créer une ordonnance
</h2>
<form id="formOrdonnance" class="space-y-5">
<div>
<label class="font-semibold">Nom du patient</label>
<input
type="text"
id="patient"
class="w-full border rounded-lg p-3 mt-2">
</div>
<div>
<label class="font-semibold">Diagnostic</label>
<textarea
id="diagnostic"
rows="4"
class="w-full border rounded-lg p-3 mt-2"></textarea>
</div>
<div>
<label class="font-semibold">Prescription</label>
<textarea
id="prescription"
rows="5"
class="w-full border rounded-lg p-3 mt-2"></textarea>
</div>
<button
class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg">
Enregistrer l'ordonnance
</button>
</form>
</div>
</main>

<script src="creer-ordonnance.js"></script>

</body>
</html>
