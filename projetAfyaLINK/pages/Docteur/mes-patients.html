<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Patients</title>
    <link rel="stylesheet" href="/src/output.css">
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow">
        <div class="max-w-6xl mx-auto flex justify-between items-center p-4">
            <h1 class="text-3xl font-bold">
                <span class="text-green-600">Afya</span><span class="text-blue-700">Link</span>
            </h1>
            <a href="dashboard2.html"
                class="text-green-600 font-semibold">
                  ← Retour
            </a>
        </div>
    </header>
    <main class="max-w-6xl mx-auto p-6">
        <h2 class="text-3xl font-bold text-center mb-6">
          Mes Patients
        </h2>
        <input
           type="text"
           id="recherche"
           placeholder="Rechercher un patient..."
           class="w-full border rounded-lg p-3 mb-8">
        <div id="listePatients" class="space-y-5">
            <div class="patient bg-white rounded-xl shadow-lg p-5">
                <h3 class="nom text-xl font-bold">
                  Henry Bisimwa
                </h3>
                <p>Âge : 21 ans</p>
                <p>Service : Cardiologie</p>
                <div class="flex gap-3 mt-4">
                    <button class="voir bg-blue-600 text-white px-4 py-2 rounded">
                       Voir
                    </button>
                    <button class="contact bg-green-600 text-white px-4 py-2 rounded">
                       Contacter
                    </button>
                </div>
            </div>
            <div class="patient bg-white rounded-xl shadow-lg p-5">
                <h3 class="nom text-xl font-bold">
                    Alice Ndayishimiye
                </h3>
                <p>Âge : 19 ans</p>
                <p>Service : Pédiatrie</p>
                <div class="flex gap-3 mt-4">
                    <button class="voir bg-blue-600 text-white px-4 py-2 rounded">
                        Voir
                    </button>
                    <button class="contact bg-green-600 text-white px-4 py-2 rounded">
                       Contacter
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="mes-patients.js"></script>

</body>
</html>
