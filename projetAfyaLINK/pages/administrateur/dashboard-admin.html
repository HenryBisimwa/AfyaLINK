<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrateur</title>

    <link rel="stylesheet" href="../../../src/output.css">
</head>

<body class="bg-gray-100">
    <header class="bg-white shadow">
        <div class="max-w-7xl mx-auto flex justify-between items-center p-4">
            <h1 class="text-3xl font-bold">
                <span class="text-green-600">Afya</span><span class="text-blue-700">Link</span>
            </h1>
            <div class="flex items-center gap-4">
                <a href="profil-admin.html"
                    class="flex items-center gap-3 hover:bg-gray-100 p-2 rounded-lg">
                    <div class="w-10 h-10 rounded-full bg-purple-600 text-white flex items-center justify-center font-bold">
                        A
                    </div>
                    <p class="font-semibold">
                        Administrateur
                    </p>
                </a>
                <button id="logout"
                    class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                    Déconnexion
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <h2 id="salutation"
                class="text-3xl font-bold text-purple-700">
                Bonjour Administrateur
            </h2>
            <p class="text-gray-500 mt-2">
                Tableau de bord Administrateur
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-white border-l-4 border-green-600 rounded-xl shadow p-6">
                <h3 class="text-lg font-semibold">
                    👥 Patients
                </h3>
                <p id="patients"
                    class="text-4xl font-bold mt-3 text-green-600">
                    250
                </p>
            </div>
            <div class="bg-white border-l-4 border-blue-600 rounded-xl shadow p-6">
                <h3 class="text-lg font-semibold">
                    👨‍⚕️ Médecins
                </h3>
                <p id="medecins"
                    class="text-4xl font-bold mt-3 text-blue-600">
                    18
                </p>
            </div>
            <div class="bg-white border-l-4 border-orange-500 rounded-xl shadow p-6">
                <h3 class="text-lg font-semibold">
                    📅 Rendez-vous
                </h3>
                <p id="rdv"
                    class="text-4xl font-bold mt-3 text-orange-500">
                    52
                </p>
            </div>
            <div class="bg-white border-l-4 border-purple-600 rounded-xl shadow p-6">
                <h3 class="text-lg font-semibold">
                    💊 Ordonnances
                </h3>
                <p id="ordonnances"
                    class="text-4xl font-bold mt-3 text-purple-600">
                    130
                </p>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg p-6 mt-8">
            <h2 class="text-2xl font-bold mb-5">
                Gestion
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <a href="gerer-medecins.html"
                    class="bg-blue-600 hover:bg-blue-700 text-white text-center rounded-lg p-4">
                    👨‍⚕️ Gérer les médecins
                </a>
                <a href="gerer-patients.html"
                    class="bg-green-600 hover:bg-green-700 text-white text-center rounded-lg p-4">
                    👥 Gérer les patients
                </a>

                <a href="gerer-rendez-vous.html"
                    class="bg-orange-500 hover:bg-orange-600 text-white text-center rounded-lg p-4">
                    📅 Gérer les rendez-vous
                </a>
                <a href="statistiques.html"
                    class="bg-purple-600 hover:bg-purple-700 text-white text-center rounded-lg p-4">
                    📊 Statistiques
                </a>
            </div>
        </div>
        <div class="text-center mt-8">
           <button id="actualiser"
                class="bg-purple-600 hover:bg-purple-700 text-white px-8 py-3 rounded-lg">
                🔄 Actualiser les statistiques
            </button>
        </div>
    </main>

    <script src="dashboard-admin.js"></script>

</body>
</html>
